    interval: 86400

proxies:  # 实际使用时会被订阅转换工具替换
  - name: "⚠️订阅节点占位"
    type: "ss"
    server: "example.com"
    port: 443
    cipher: "aes-256-gcm"
    password: "password"
    udp: true

proxy-groups:
  - name: ✅节点选择
    type: select
    proxies:
      - ♻️自动切换
      - DIRECT

  - name: 🤖AI
    type: select
    proxies:
      - ✅节点选择
      - ♻️自动切换
      - DIRECT

  - name: 🎧Spotify
    type: select
    proxies:
      - ♻️自动切换
      - ✅节点选择
      - DIRECT

  - name: Ⓜ️微软服务
    type: select
    proxies:
      - 🔗直连
      - ✅节点选择

  - name: 🍎苹果
    type: select
    proxies:
      - 🔗直连
      - ✅节点选择

  - name: 🅰️Adobe
    type: select
    proxies:
      - REJECT
      - DIRECT
      - ✅节点选择 

  - name: ♻️自动切换
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - ⚠️订阅节点占位 # 订阅转换后，这里会自动塞满机场节点

  - name: 🔗直连
    type: select
    proxies:
      - DIRECT
      - ✅节点选择

  - name: ⛔广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 中转
    type: select
    proxies:
      - ✅节点选择
      - 🔗直连

geox-url:
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
geodata-mode: true

rules:
  # ======== 1. 极致广告拦截与隐私保护 (最优先匹配) ========
  - RULE-SET,reject,⛔广告拦截
  - GEOSITE,category-ads-all,⛔广告拦截

  # ======== 2. 本地与局域网直连 (Bypass LAN) ========
  - RULE-SET,applications,🔗直连
  - RULE-SET,private,🔗直连
  - RULE-SET,lancidr,🔗直连
  - DOMAIN-SUFFIX,local,🔗直连
  - DOMAIN-SUFFIX,localhost,🔗直连
  - IP-CIDR,192.168.0.0/16,🔗直连
  - IP-CIDR,10.0.0.0/8,🔗直连
  - IP-CIDR,127.0.0.0/8,🔗直连
  - IP-CIDR,100.64.0.0/10,🔗直连

  # ======== 3. 人工智能特化 (AI Services) ========
