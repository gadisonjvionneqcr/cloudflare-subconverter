mode: rule # 💡 我把这里的 direct 改成了 rule（规则模式），这样才能实现国内直连、国外走节点。

port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
external-controller: 0.0.0.0:9090
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: strict

ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 30

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: false
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
    QUIC:
      ports: [443]

dns:
  enable: true
  listen: :1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipmask:
      - 240.0.0.0/4
  fake-ip-filter:
    - tplinkwifi.net
    - miwifi.com
    - router.asus.com
    - +.lan
    - localhost.ptlogin2.qq.com
    - geoip:private
    - geoip:cn
    - +.steamcommunity.com
    - +.steampowered.com
    - +.epicgames.com
    - +.ea.com

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
  device: SakuraiTunnel
  mtu: 1500
  endpoint-independent-nat: true

# 独立规则集 (Rule Providers) - 每天自动异步更新，保持最新去广告和分流规则
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

