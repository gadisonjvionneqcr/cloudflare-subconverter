mode: rule # 💡 我把这里的 direct 改成了 rule（规则模式），这样才能实现国内直连、国外走节点。
mixed-port: 7897
allow-lan: false
log-level: info
ipv6: true
external-controller: ''
secret: set-your-secret
unified-delay: true
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
external-controller-cors:
  allow-private-network: true
  allow-origins:
  - tauri://localhost
  - http://tauri.localhost
  - https://yacd.metacubex.one
  - https://metacubex.github.io
  - https://board.zash.run.place
external-controller-pipe: \\.\pipe\verge-mihomo
tun:
  enable: true
  stack: gvisor
  auto-route: true
  strict-route: false
  auto-detect-interface: true
  dns-hijack:
  - any:53


# 💡 ================= 1. 节点添加位置 =================  
proxies:  # 这里的内容会被替换
  - name: "example"
    type: "ss"
    server: "example.com"
    port: 443
    cipher: "aes-256-gcm"
    password: "password"
    udp: true
# 💡 ================= 2. 策略组（把节点组合起来） =================
proxy-groups:
  - name: ✅节点选择
    type: select
    proxies:
      - ♻️自动切换
      - DIRECT
  - name: 🤖AI
    type: select
    proxies:
  - name: 🎧Spotify
    type: select
    proxies:
      - ♻️自动切换
  - name: Ⓜ️微软服务
    type: select
    proxies:
      - 🔗直连
      - ✅节点选择
  - name: 🍎苹果
    type: select
    proxies:
      - 🔗直连
      - ✅节点选择
  - name: 🅰️Adobe
    type: select
    proxies:
      - REJECT
      - DIRECT
      - ✅节点选择 
  - name: ♻️自动切换
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
  - name: 🔗直连
    type: select
    proxies:
      - DIRECT
      - ✅节点选择
  - name: ⛔拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
      - ✅节点选择
  - name: 中转
    type: select
    proxies:
      - ✅节点选择
      - 🔗直连
geox-url:
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
geodata-mode: true


# 💡 ================= 3. 基础分流规则 =================
rules:
  # 1. 本地与局域网直连
  - DOMAIN-SUFFIX,local,🔗直连
  - DOMAIN-SUFFIX,localhost,🔗直连
  - IP-CIDR,192.168.0.0/16,🔗直连
  - IP-CIDR,10.0.0.0/8,🔗直连
  - IP-CIDR,127.0.0.0/8,🔗直连
  - IP-CIDR,100.64.0.0/10,🔗直连

  # 2. 广告拦截
  - GEOSITE,category-ads-all,⛔拦截

  # 3. 音乐与滚动歌词
  - GEOSITE,spotify,🎧Spotify
  - DOMAIN-KEYWORD,lyricify,🎧Spotify
  - DOMAIN-SUFFIX,lyricify.com,🎧Spotify
  - DOMAIN-SUFFIX,lyricify.top,🎧Spotify

  # 4. 游戏特化
  - PROCESS-NAME,TslGame.exe,✅节点选择
  - PROCESS-NAME,TslGame_BE.exe,✅节点选择
  - GEOSITE,pubg,✅节点选择
  - GEOSITE,steam,✅节点选择
  - GEOSITE,epicgames,✅节点选择
